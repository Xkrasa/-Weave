<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weave · 写作工作台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="mark">W</span><span>Weave</span></div>
      <div class="project-meta">
        <strong id="project-title">加载中</strong>
        <span id="project-subtitle" class="muted"></span>
      </div>
      <div id="top-badges" class="top-badges"></div>
      <div class="top-actions">
        <button class="ghost" id="btn-library">书库</button>
        <button class="ghost" id="btn-model">模型</button>
        <button class="ghost" id="btn-eval">盲评</button>
        <button class="ghost" id="btn-search">搜索</button>
        <button class="ghost" id="btn-ideas-map">想法地图</button>
        <button class="ghost" id="btn-deconstruct">拆书</button>
        <button class="ghost" id="btn-doctor">体检</button>
        <button class="ghost" id="btn-export">导出</button>
        <button class="ghost" id="btn-refresh">刷新</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span>章节</span>
          <span id="chapter-count" class="pill"></span>
        </div>
        <div class="chapter-filters" id="chapter-filters">
          <button data-filter="all" class="active">全部</button>
          <button data-filter="blocking">有阻塞</button>
          <button data-filter="failed">生成失败</button>
          <button data-filter="recoverable">可恢复</button>
        </div>
        <div id="chapter-list" class="chapter-list"></div>
        <div class="sidebar-foot">
          <div class="legend"><i class="dot finalized"></i>定稿 <i class="dot draft"></i>草稿 <i class="dot blocking"></i>阻断</div>
          <div class="stage-legend small muted">合同 · 节拍 · 分段 · 草稿 · 检查 · 定稿</div>
          <div id="project-flags" class="muted small"></div>
        </div>
      </aside>

      <section class="editor-panel">
        <div class="editor-head">
          <div>
            <div class="eyebrow" id="chapter-eyebrow">选择章节</div>
            <h1 id="chapter-title">开始写作</h1>
          </div>
          <div class="head-actions">
            <button id="btn-next" class="accent" title="Ctrl+Enter 执行驾驶舱推荐的下一步">下一步</button>
            <button id="btn-mode" class="ghost" title="Ctrl+E 切换编辑/审阅">审阅模式</button>
            <div class="save-state" id="save-state">未打开</div>
          </div>
        </div>

        <div class="intent-strip" id="intent-strip">
          <span class="muted">本章合同会显示在这里。</span>
        </div>

        <div class="stagebar" id="stagebar">
          <button data-stage="contract-check">合同检查</button>
          <button data-stage="check">内容检查</button>
          <button data-stage="extract">抽取</button>
          <button data-stage="audit">审计</button>
          <button data-stage="review">审查</button>
          <button data-stage="recheck">复检</button>
          <button data-stage="write" class="accent">生成</button>
          <button id="btn-cancel" class="hidden">取消生成</button>
          <button data-stage="amend">重开</button>
          <button data-stage="finalize" class="danger">定稿</button>
        </div>

        <div id="selection-tools" class="selection-tools hidden">
          <span class="muted small">划词修稿</span>
          <button data-selection-op="polish">润色</button>
          <button data-selection-op="expand">扩写</button>
          <button data-selection-op="correct">纠错</button>
          <button data-selection-op="custom">自定义</button>
        </div>

        <div class="editor-wrap" id="editor-wrap">
          <div id="draft-view" class="draft-view hidden"></div>
          <textarea id="draft" spellcheck="false" placeholder="选择章节后开始写作，或使用“生成”创建草稿。"></textarea>
        </div>

        <div class="gate-bar" id="gate-bar"></div>

        <div class="status-bar" id="status-bar">
          <span id="word-count">0 字</span>
          <span id="token-estimate" class="muted"></span>
          <span id="save-time" class="muted"></span>
          <span id="blocking-count" class="muted"></span>
          <span id="context-usage" class="muted"></span>
          <span id="draft-hash" class="muted"></span>
        </div>
      </section>

      <aside class="inspector">
        <div class="tabs" id="tabs">
          <button data-tab="findings" class="active">问题</button>
          <button data-tab="evidence">证据</button>
          <button data-tab="ideas">想法</button>
          <button data-tab="revisions">版本</button>
          <button data-tab="beats">节拍</button>
          <button data-tab="segments">分段</button>
          <button data-tab="context">上下文</button>
          <button data-tab="plan">规划</button>
          <button data-tab="stages">阶段</button>
          <button data-tab="methods">方法</button>
          <button data-tab="effect">效果</button>
          <button data-tab="style">风格</button>
          <button data-tab="history">历史</button>
          <button data-tab="waivers">豁免</button>
          <button data-tab="contract">合同</button>
        </div>
        <div id="inspector-body" class="inspector-body">
          <div class="empty">选择章节查看审查结果。</div>
        </div>
      </aside>
    </main>

    <div id="drawer" class="drawer hidden">
      <div class="drawer-card">
        <div class="drawer-head">
          <strong>全文搜索</strong>
          <button class="icon" id="drawer-close">×</button>
        </div>
        <form id="search-form" class="search-form">
          <input id="search-q" placeholder="输入中文短词，例如：账本" autocomplete="off">
          <button class="accent">搜索</button>
        </form>
        <div class="search-filters">
          <input id="search-entity" placeholder="人物">
          <input id="search-location" placeholder="地点">
          <input id="search-storyline" placeholder="故事线">
          <input id="search-time" placeholder="时间">
        </div>
        <div id="search-results" class="results"></div>
      </div>
    </div>

    <div id="eval-view" class="eval-view hidden">
      <div class="eval-head">
        <div>
          <div class="eyebrow">盲评 · 只看正文，不看来源</div>
          <strong id="eval-title"></strong>
          <span id="eval-progress" class="muted small"></span>
        </div>
        <div class="eval-actions">
          <button id="eval-report" class="ghost">查看结果</button>
          <button id="eval-close" class="icon">×</button>
        </div>
      </div>
      <div class="eval-columns">
        <section class="eval-col">
          <div class="eval-col-head"><strong>左</strong><button data-eval-stop="Left" class="ghost">选中文字 → 标为弃读点</button></div>
          <div id="eval-stop-Left" class="eval-stop muted small"></div>
          <article id="eval-left" class="eval-text"></article>
        </section>
        <section class="eval-col">
          <div class="eval-col-head"><strong>右</strong><button data-eval-stop="Right" class="ghost">选中文字 → 标为弃读点</button></div>
          <div id="eval-stop-Right" class="eval-stop muted small"></div>
          <article id="eval-right" class="eval-text"></article>
        </section>
      </div>
      <div class="eval-foot">
        <input id="eval-note" placeholder="一句话理由（可选）：例如“右边开头就进冲突”" autocomplete="off">
        <button data-eval-winner="left" class="accent">更想继续读左边</button>
        <button data-eval-winner="tie">差不多</button>
        <button data-eval-winner="right" class="accent">更想继续读右边</button>
      </div>
    </div>

    <div id="palette" class="palette hidden">
      <div class="palette-card">
        <input id="palette-q" autocomplete="off" placeholder="输入命令…（Ctrl+P）">
        <div id="palette-list" class="palette-list"></div>
        <div class="palette-foot muted small">↑↓ 选择 · Enter 执行 · Esc 关闭</div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head"><strong id="modal-title"></strong><button class="icon" id="modal-close">×</button></div>
        <div id="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
